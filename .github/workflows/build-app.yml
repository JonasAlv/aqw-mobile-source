name: Build App

on:
    workflow_dispatch:
        inputs:
            version_prefix:
                description: 'Version prefix (e.g., 3.1.2)'
                required: true
                default: '3.1.2'
            prerelease:
                description: 'Mark as pre-release'
                required: true
                default: 'true'
                type: choice
                options:
                    - 'true'
                    - 'false'

jobs:
    patch:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            VERSION: ${{ steps.version.outputs.VERSION }}
            VERSION_NUMBER: ${{ steps.version.outputs.VERSION_NUMBER }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            
            -   name: Set version
                id: version
                run: |
                    echo "VERSION=v${{ github.event.inputs.version_prefix }}" >> $GITHUB_OUTPUT
                    echo "VERSION_NUMBER=${{ github.event.inputs.version_prefix }}" >> $GITHUB_OUTPUT
                    echo "IS_PRERELEASE=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
            
            -   name: Setup D Compiler
                uses: dlang-community/setup-dlang@v1
                with:
                    compiler: dmd-latest
                    
            -   name: Build and Install RABCDAsm
                run: |
                    sudo apt-get update
                    sudo apt-get install -y liblzma-dev
                    git clone https://github.com/CyberShadow/RABCDAsm.git /tmp/RABCDAsm
                    cd /tmp/RABCDAsm
                    dmd build_rabcdasm.d
                    ./build_rabcdasm
                    sudo cp abcexport abcreplace rabcdasm rabcasm swfdecompress swf7zcompress swfbinexport swfbinreplace swflzmacompress /usr/local/bin/

            -   name: Run Python Patcher
                run: python3 patcher.py
            
            -   name: Keystore
                run: |
                    keytool -genkey -v -keystore aqwpocket_keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias aqwpocket -storepass aqwpocket -keypass aqwpocket -dname "CN=AQW, OU=AQW, O=AQW, L=Unknown, ST=Unknown, C=US"
                    keytool -importkeystore -srckeystore aqwpocket_keystore.jks -srcstorepass aqwpocket -srcalias aqwpocket -destkeystore aqwpocket_keystore.p12 -deststoretype PKCS12 -deststorepass aqwpocket -destkeypass aqwpocket
            
            -   name: Inject version
                run: |
                    sed -i "s|<versionNumber>.*</versionNumber>|<versionNumber>${{ steps.version.outputs.VERSION_NUMBER }}</versionNumber>|" loader/Mobile-app.xml
                    sed -i "s|<versionLabel>.*</versionLabel>|<versionLabel>${{ steps.version.outputs.VERSION_NUMBER }}</versionLabel>|" loader/Mobile-app.xml
                    sed -i "s|<versionNumber>.*</versionNumber>|<versionNumber>${{ steps.version.outputs.VERSION_NUMBER }}</versionNumber>|" loader/Desktop-app.xml
                    sed -i "s|<versionLabel>.*</versionLabel>|<versionLabel>${{ steps.version.outputs.VERSION_NUMBER }}</versionLabel>|" loader/Desktop-app.xml
            
            -   name: Upload patched files
                uses: actions/upload-artifact@v4
                with:
                    name: patched-files
                    path: |
                        loader/
                        aqwpocket_keystore.jks
                        aqwpocket_keystore.p12
    
    build-android:
        needs: patch
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            matrix:
                include:
                    -   architecture: "armv8"
                        render-mode: "auto"
                        suffix: ""
                    -   architecture: "armv7"
                        render-mode: "auto"
                        suffix: ""
        
        steps:
            -   name: Download patched files
                uses: actions/download-artifact@v4
                with:
                    name: patched-files
            
            -   name: Setup AIR SDK
                uses: joshtynjala/setup-adobe-air-action@v2
                with:
                    air-version: "51.3.1"
                    accept-license: yes
            
            -   name: Build APK
                run: |
                    sed -i "s|<renderMode>.*</renderMode>|<renderMode>${{ matrix.render-mode }}</renderMode>|" loader/Mobile-app.xml
                    adt -package \
                      -target apk-captive-runtime \
                      -arch ${{ matrix.architecture }} \
                      -storetype JKS \
                      -keystore aqwpocket_keystore.jks \
                      -storepass aqwpocket \
                      -keypass aqwpocket \
                      AQWPocket-${{ needs.patch.outputs.VERSION }}-${{ matrix.architecture }}${{ matrix.suffix }}.apk \
                      loader/Mobile-app.xml \
                      -C loader \
                        Mobile.swf \
                        icons/icon-36x36.png \
                        icons/icon-48x48.png \
                        icons/icon-72x72.png \
                        icons/icon-96x96.png \
                        icons/icon-144x144.png \
                        icons/icon-192x192.png \
                        gamefiles/game.swf \
                        gamefiles/world-map.swf \
                        gamefiles/book-of-lore.swf \
                        gamefiles/character-select.swf
            
            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: build-${{ matrix.architecture }}${{ matrix.suffix }}
                    path: "*.apk"

    build-windows:
        needs: patch
        runs-on: windows-latest
        steps:
            -   name: Download patched files
                uses: actions/download-artifact@v4
                with:
                    name: patched-files
            
            -   name: Setup AIR SDK
                uses: joshtynjala/setup-adobe-air-action@v2
                with:
                    air-version: "51.3.1"
                    accept-license: yes
            
            -   name: Build Windows App
                run: |
                    adt -certificate -cn AQWPocket -validityPeriod 25 2048-RSA desktop.p12 aqwpocket
                    adt -package -storetype PKCS12 -keystore desktop.p12 -storepass aqwpocket -target bundle AQWPocket-${{ needs.patch.outputs.VERSION }}-windows loader/Desktop-app.xml -C loader Desktop.swf icons/icon-16x16.png icons/icon-32x32.png icons/icon-36x36.png icons/icon-48x48.png icons/icon-72x72.png icons/icon-96x96.png icons/icon-128x128.png icons/icon-144x144.png icons/icon-192x192.png gamefiles/game.swf gamefiles/world-map.swf gamefiles/book-of-lore.swf gamefiles/character-select.swf
                    Compress-Archive -Path AQWPocket-${{ needs.patch.outputs.VERSION }}-windows -DestinationPath AQWPocket-${{ needs.patch.outputs.VERSION }}-windows.zip
            
            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: build-windows
                    path: "*.zip"

    build-linux:
        needs: patch
        runs-on: ubuntu-latest
        steps:
            -   name: Download patched files
                uses: actions/download-artifact@v4
                with:
                    name: patched-files
            
            -   name: Setup AIR SDK
                uses: joshtynjala/setup-adobe-air-action@v2
                with:
                    air-version: "51.3.1"
                    accept-license: yes
            
            -   name: Build Linux App
                run: |
                    adt -certificate -cn AQWPocket -validityPeriod 25 2048-RSA desktop.p12 aqwpocket
                    adt -package -storetype PKCS12 -keystore desktop.p12 -storepass aqwpocket -target bundle AQWPocket-${{ needs.patch.outputs.VERSION }}-linux loader/Desktop-app.xml -C loader Desktop.swf icons/icon-16x16.png icons/icon-32x32.png icons/icon-36x36.png icons/icon-48x48.png icons/icon-72x72.png icons/icon-96x96.png icons/icon-128x128.png icons/icon-144x144.png icons/icon-192x192.png gamefiles/game.swf gamefiles/world-map.swf gamefiles/book-of-lore.swf gamefiles/character-select.swf
                    zip -r AQWPocket-${{ needs.patch.outputs.VERSION }}-linux.zip AQWPocket-${{ needs.patch.outputs.VERSION }}-linux
            
            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: build-linux
                    path: "*.zip"

    publish:
        needs: [patch, build-android, build-windows, build-linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                
            -   name: Download builds
                uses: actions/download-artifact@v4
                with:
                    pattern: build-*
                    merge-multiple: true
            
            -   name: Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ needs.patch.outputs.VERSION }}
                    name: ${{ needs.patch.outputs.VERSION }}${{ github.event.inputs.prerelease == 'true' && ' (test)' || '' }}
                    prerelease: ${{ github.event.inputs.prerelease }}
                    body: |
                        ## Which file should I download?

                        ### Android
                        * **armv8 (recommended)**: `AQWPocket-${{ needs.patch.outputs.VERSION }}-armv8.apk`
                        * **armv7 (32-bit)**: `AQWPocket-${{ needs.patch.outputs.VERSION }}-armv7.apk`

                        ### Windows
                        * `AQWPocket-${{ needs.patch.outputs.VERSION }}-windows.zip`

                        ### Linux
                        * `AQWPocket-${{ needs.patch.outputs.VERSION }}-linux.zip`
                    files: |
                        *.apk
                        *.zip
